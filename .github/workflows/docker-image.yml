name: Docker WASM AudioRemaster Compile

on:
  push:
    branches: [ "AirFreshener" ]
  pull_request:
    branches: [ "AirFreshener" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4.2.2
    - name: Build AIR Freshener with AudioRemaster for WASM
      run: |
        cd ./Oxygen/sonic3air/build/_emscripten
        docker build -t emscripten_gl .
        docker run --rm -v $GITHUB_WORKSPACE:/src -u $(id -u):$(id -g) --name sonic3air_build emscripten_gl /bin/bash -c "
          mkdir -p /src/Oxygen/sonic3air/build/_emscripten/build && \
          cd /src/Oxygen/sonic3air/build/_emscripten/build && \
          emmake cmake -DCMAKE_BUILD_TYPE=Release -DWORKSPACE_DIR=/src .. && \
          emmake cmake --build .
        "
