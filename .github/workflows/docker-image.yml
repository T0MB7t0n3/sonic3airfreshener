name: Docker Image CI

on:
  push:
    branches: [ "AirFreshener" ]
  pull_request:
    branches: [ "AirFreshener" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the emscripten_gl container
      run: cd ./Oxygen/sonic3air/build/_emscripten
      docker build -t emscripten_gl .
